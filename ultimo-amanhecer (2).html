<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Último Amanhecer</title>
<style>
  :root{
    --bg:#0d0f0c; --panel:#161a14; --ink:#d8dccf; --muted:#8a9180;
    --accent:#a3c45a; --blood:#b5382f; --line:#2a3125; --gold:#d9a441;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;
    background-image:radial-gradient(ellipse at top,#1b2117 0%,var(--bg) 70%)}
  main{width:100%;max-width:720px;padding:28px 16px 48px}
  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
  .top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
  h1{font-size:1.4rem;letter-spacing:.15em;text-transform:uppercase;margin:0;color:var(--accent)}
  .stats{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--muted)}
  .stats b{color:var(--ink)}
  .bar{height:5px;background:#222820;border-radius:3px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:22px}
  .chip{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--ink)}
  .chip.bad{border-color:var(--blood);color:#e58a80}
  .art{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:22px;background:#000}
  .art svg{display:block;width:100%;height:auto}
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 20px rgba(0,0,0,.75)}
  .chapter{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blood);margin-bottom:8px}
  .scene-title{font-size:1.6rem;margin:0 0 18px}
  #text p{line-height:1.7;font-size:1.08rem;margin:0 0 14px}
  #text p.say{color:var(--accent);font-style:italic}
  .fx{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
  .fx span{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;padding:4px 10px;border-radius:4px;background:#1c211a;border:1px solid var(--line)}
  .fx .neg{color:#e58a80;border-color:#4a2420}
  .fx .pos{color:var(--accent);border-color:#33421f}
  .fx .neu{color:var(--gold);border-color:#4a3c1c}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  button{font:inherit;cursor:pointer;text-align:left;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-left:3px solid var(--accent);padding:14px 16px;border-radius:4px;transition:.15s}
  button:hover,button:focus-visible{background:#1f251b;border-color:var(--accent);outline:none}
  button small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
  button.danger{border-left-color:var(--blood)}
  .ending{border:1px solid var(--line);background:var(--panel);padding:18px;border-radius:4px;margin-top:20px}
  .ending .tag{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
  .ending h3{margin:6px 0 0;font-size:1.4rem}
  .gallery{margin-top:28px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--muted)}
  .gallery ul{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .gallery li{border:1px dashed var(--line);padding:8px;border-radius:4px}
  .gallery li.got{border-style:solid;border-color:var(--accent);color:var(--ink)}
  .fade{animation:fade .6s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .flicker{animation:flick 3s infinite}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.85}48%{opacity:.35}50%{opacity:.9}}
  .fire{animation:fire .4s infinite alternate;transform-box:fill-box;transform-origin:bottom}
  @keyframes fire{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
  .spin{animation:rot .25s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes rot{from{transform:scaleX(1)}50%{transform:scaleX(-1)}to{transform:scaleX(1)}}
  .sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  .glowp{animation:gp 2s ease-in-out infinite alternate}
  @keyframes gp{from{opacity:.55}to{opacity:1}}
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <h1>Último Amanhecer</h1>
      <div class="stats">Dia <b id="day">1</b> · Vida <b id="hp">100</b> · Suprimentos <b id="sup">3</b></div>
    </div>
    <div class="bar"><i id="hpbar" style="width:100%"></i></div>
    <div class="chips" id="chips"></div>
  </header>
  <section id="scene" class="fade"></section>
</main>

<script>
/* =====================================================
   ILUSTRAÇÕES (SVG desenhado em código)
   ===================================================== */
const svg = (label, body) =>
  `<svg viewBox="0 0 640 300" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
const rng = seed => () => (seed = (seed*9301+49297)%233280)/233280;

const zombie = (x,y,s=1,c="#060806") =>
  `<g transform="translate(${x},${y}) scale(${s})"><g class="sway" fill="${c}">
    <circle cx="3" cy="-57" r="7"/><path d="M-7,-50 L7,-50 L9,-21 L-8,-21Z"/>
    <path d="M-5,-48 L-25,-42 L-25,-38 L-4,-42Z"/><path d="M6,-48 L24,-45 L25,-41 L5,-42Z"/>
    <path d="M-8,-22 L-13,0 L-7,0 L-1,-21Z"/><path d="M8,-22 L11,0 L5,0 L1,-21Z"/></g></g>`;

const person = (x,y,s=1,c="#060806",extra="") =>
  `<g transform="translate(${x},${y}) scale(${s})" fill="${c}">
    <circle cx="0" cy="-58" r="7"/><path d="M-8,-50 L8,-50 L9,-22 L-9,-22Z"/>
    <path d="M-8,-49 L-12,-26 L-8,-26 L-5,-45Z"/><path d="M8,-49 L12,-26 L8,-26 L5,-45Z"/>
    <path d="M-8,-23 L-7,0 L-2,0 L0,-21Z"/><path d="M8,-23 L7,0 L2,0 L0,-21Z"/>${extra}</g>`;

const raider = (x,y,s,c) => person(x,y,s,c,
  `<path d="M-8,-62 L-14,-76 L-4,-65 L0,-80 L4,-65 L14,-76 L8,-62Z"/><path d="M8,-46 L22,-82 L26,-80 L12,-44Z"/>`);

const dog = (x,y,s=1,c="#060806") =>
  `<g transform="translate(${x},${y}) scale(${s})" fill="${c}">
    <ellipse cx="0" cy="-16" rx="16" ry="7"/><circle cx="16" cy="-24" r="6"/>
    <path d="M13,-28 L16,-37 L20,-28Z"/><path d="M20,-25 L29,-23 L28,-19 L20,-20Z"/>
    <rect x="-13" y="-12" width="3" height="12"/><rect x="-7" y="-12" width="3" height="12"/>
    <rect x="6" y="-12" width="3" height="12"/><rect x="11" y="-12" width="3" height="12"/>
    <path d="M-15,-18 L-25,-29 L-22,-31 L-12,-21Z"/></g>`;

const grad = (id,stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient>`;

const ART = {
  intro(){
    const r = rng(7); let win="", stars="";
    for(let row=0;row<14;row++) for(let col=0;col<4;col++){
      const lit=row===1&&col===2;
      win+=`<rect x="${258+col*15}" y="${52+row*16}" width="9" height="10" fill="${lit?"#f0c96a":(r()<.15?"#2c2a1c":"#141812")}" ${lit?'class="flicker"':""}/>`;
    }
    for(let i=0;i<40;i++) stars+=`<circle cx="${r()*640}" cy="${r()*120}" r="${r()*1.2+.3}" fill="#cfd6c4" opacity="${r()*.6+.2}"/>`;
    const back=[[0,140,70],[60,110,50],[105,150,60],[170,90,45],[330,100,60],[400,140,70],[470,120,55],[530,150,110]]
      .map(([x,y,w])=>`<rect x="${x}" y="${y}" width="${w}" height="${300-y}" fill="#141a13"/>`).join("");
    return svg("Cidade em ruínas à noite, uma única janela acesa",`
      <defs>${grad("sk",["#070a0e","#2c3122"])}
        <radialGradient id="glow"><stop offset="0" stop-color="#f0c96a" stop-opacity=".55"/><stop offset="1" stop-color="#f0c96a" stop-opacity="0"/></radialGradient>
        <radialGradient id="fire"><stop offset="0" stop-color="#d4542a" stop-opacity=".6"/><stop offset="1" stop-color="#d4542a" stop-opacity="0"/></radialGradient></defs>
      <rect width="640" height="300" fill="url(#sk)"/>${stars}
      <circle cx="540" cy="62" r="24" fill="#dcd8b8" opacity=".85"/>
      <ellipse cx="120" cy="250" rx="180" ry="90" fill="url(#fire)"/>
      <ellipse cx="160" cy="120" rx="90" ry="22" fill="#3a3c34" opacity=".35"/>
      ${back}<rect x="250" y="40" width="70" height="260" fill="#0d110c"/>${win}
      <circle cx="292" cy="73" r="30" fill="url(#glow)"/>
      <rect y="272" width="640" height="28" fill="#070806"/>
      ${zombie(70,290,.85)}${zombie(150,292,.75)}${zombie(410,290,1)}${zombie(470,294,.8)}${zombie(585,292,.9)}`);
  },

  quarto(){
    return svg("Sala com janela tapada por tábuas; sobre a mesa, um kit médico e uma pistola",`
      <defs><linearGradient id="ray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d9a0" stop-opacity=".35"/><stop offset="1" stop-color="#e8d9a0" stop-opacity="0"/></linearGradient></defs>
      <rect width="640" height="300" fill="#15130f"/>
      <rect y="235" width="640" height="65" fill="#0d0b09"/>
      <rect x="380" y="40" width="170" height="130" fill="#d8c88a"/>
      <g fill="#1d1812">${[48,78,108,138].map((y,i)=>`<rect x="370" y="${y}" width="190" height="22" transform="rotate(${i%2?3:-2} 465 ${y})"/>`).join("")}</g>
      <polygon points="380,60 550,160 520,300 250,300" fill="url(#ray)"/>
      <rect x="150" y="170" width="300" height="12" fill="#2a2119"/>
      <rect x="165" y="182" width="10" height="70" fill="#2a2119"/><rect x="425" y="182" width="10" height="70" fill="#2a2119"/>
      <rect x="200" y="140" width="62" height="30" rx="3" fill="#d8dccf"/>
      <rect x="226" y="146" width="10" height="20" fill="#b5382f"/><rect x="221" y="151" width="20" height="10" fill="#b5382f"/>
      <path d="M330,168 L330,156 L372,156 L372,148 L380,148 L380,162 L348,162 L344,170Z" fill="#0a0a0a"/>
      <circle cx="390" cy="166" r="2" fill="#c8a060"/><circle cx="396" cy="167" r="2" fill="#c8a060"/><circle cx="402" cy="166" r="2" fill="#c8a060"/>
      <path d="M470,250 Q470,195 505,195 Q540,195 540,250Z" fill="#2c3324"/>
      ${person(90,290,1.6,"#050403")}`);
  },

  mercado(){
    const r=rng(3); let items="";
    const cols=["#5b3a2a","#3b4f38","#6a5a2a","#2e3e52","#5a2626"];
    [80,120,160].forEach(y=>{ for(let x=36;x<172;x+=11) if(r()<.55) items+=`<rect x="${x}" y="${y-14+r()*3}" width="8" height="${12+r()*2}" fill="${cols[Math.floor(r()*5)]}"/>`; });
    return svg("Mercado saqueado; um homem ferido levanta as mãos, zumbis na vitrine",`
      <defs><clipPath id="w"><rect x="420" y="40" width="180" height="110"/></clipPath>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c4a8" stop-opacity=".18"/><stop offset="1" stop-color="#b8c4a8" stop-opacity="0"/></linearGradient></defs>
      <rect width="640" height="300" fill="#1a1e17"/><rect y="232" width="640" height="68" fill="#0f120d"/>
      <rect x="420" y="40" width="180" height="110" fill="#56634f"/>
      <g clip-path="url(#w)">${zombie(450,175,1.5,"#1a2016")}${zombie(510,180,1.6,"#141a11")}${zombie(570,172,1.4,"#1a2016")}</g>
      <path d="M420,40 L600,40 L600,150 L420,150Z M510,40 L510,150 M420,95 L600,95" stroke="#0c0f0a" stroke-width="5" fill="none"/>
      <path d="M455,55 L480,80 L470,100 M480,80 L505,72" stroke="#cfd6c4" stroke-width="1" opacity=".6" fill="none"/>
      <polygon points="420,150 600,150 640,300 330,300" fill="url(#beam)"/>
      <rect x="30" y="50" width="150" height="182" fill="#232a20" stroke="#0c0f0a" stroke-width="3"/>
      ${[80,120,160,200].map(y=>`<rect x="30" y="${y}" width="150" height="4" fill="#0c0f0a"/>`).join("")}${items}
      <rect x="190" y="200" width="140" height="22" fill="#232a20" transform="rotate(-14 260 211)"/>
      <rect x="250" y="168" width="150" height="68" fill="#2a2119"/><rect x="244" y="162" width="162" height="8" fill="#3a2e22"/>
      <ellipse cx="500" cy="262" rx="55" ry="9" fill="#5a1410"/>
      <g fill="#0b0d0a"><circle cx="470" cy="190" r="10"/><path d="M458,202 L482,202 L486,245 L455,245Z"/>
        <path d="M458,205 L440,180 L436,168 L442,166 L448,178 L462,198Z"/><path d="M482,205 L500,180 L504,168 L498,166 L492,178 L478,198Z"/>
        <path d="M455,240 L540,250 L540,262 L455,256Z"/></g>
      <path d="M495,250 L530,254 L530,260 L495,256Z" fill="#7a1a14"/>
      ${person(110,300,1.5,"#040504",`<path d="M10,-30 L30,-70" stroke="#3a3f38" stroke-width="3"/>`)}`);
  },

  postoNoite(marcos){
    return svg("Loja de conveniência à noite; lá fora, um cachorro late e zumbis se aproximam",`
      <defs>${grad("nb",["#0c1626","#26384c"])}</defs>
      <rect width="640" height="300" fill="#0b0d0c"/>
      <rect x="200" y="50" width="240" height="190" fill="url(#nb)"/>
      <circle cx="390" cy="85" r="16" fill="#cfdbe6" opacity=".8"/>
      <rect x="200" y="200" width="240" height="40" fill="#121a24"/>
      ${zombie(235,212,.55,"#05080c")}${zombie(420,214,.6,"#05080c")}${zombie(450,210,.5,"#05080c")}
      ${dog(330,232,1.1,"#05070a")}
      <g stroke="#cfdbe6" stroke-width="1.5" opacity=".7"><path d="M368,198 q6,4 0,8"/><path d="M374,195 q9,7 0,14"/></g>
      <path d="M200,50 L440,50 L440,240 L200,240Z M320,50 L320,240" stroke="#050605" stroke-width="7" fill="none"/>
      <rect x="300" y="135" width="8" height="20" fill="#050605"/>
      <polygon points="200,240 440,240 520,300 120,300" fill="#cfdbe6" opacity=".06"/>
      <rect x="0" y="80" width="150" height="200" fill="#111411"/>${[120,160,200,240].map(y=>`<rect x="0" y="${y}" width="150" height="4" fill="#070807"/>`).join("")}
      <rect x="490" y="80" width="150" height="200" fill="#111411"/>${[120,160,200,240].map(y=>`<rect x="490" y="${y}" width="150" height="4" fill="#070807"/>`).join("")}
      <rect y="262" width="640" height="38" fill="#070807"/>
      <g fill="#020302"><circle cx="160" cy="232" r="9"/><path d="M150,242 L172,240 L178,280 L148,282Z"/><path d="M146,280 L190,276 L190,286 L146,288Z"/></g>
      ${marcos?`<g fill="#020302"><circle cx="560" cy="250" r="9"/><path d="M520,262 L570,256 L574,276 L515,280Z"/></g>`:""}`);
  },

  hospital(){
    return svg("Fachada do Hospital Santa Clara, letreiro com a cruz quebrada, ambulância abandonada",`
      <defs>${grad("hs",["#283028","#6a7466"])}</defs>
      <rect width="640" height="300" fill="url(#hs)"/>
      <rect x="140" y="40" width="360" height="230" fill="#161b16"/>
      ${Array.from({length:6},(_,r)=>Array.from({length:10},(_,c)=>`<rect x="${158+c*34}" y="${60+r*30}" width="20" height="16" fill="${(r*7+c*3)%11===0?"#3a2a1a":"#0c100c"}"/>`).join("")).join("")}
      <rect x="290" y="12" width="60" height="34" fill="#161b16"/>
      <rect x="312" y="16" width="16" height="26" fill="#b5382f" class="flicker"/><rect x="302" y="22" width="36" height="12" fill="#b5382f" class="flicker"/>
      <text x="320" y="225" text-anchor="middle" font-family="monospace" font-size="12" fill="#7f8a7a" letter-spacing="3">HOSPITAL SANTA CLARA</text>
      <rect x="280" y="232" width="80" height="38" fill="#050605"/>
      <rect y="268" width="640" height="32" fill="#0d100d"/>
      <g fill="#0b0e0b"><path d="M430,268 L430,228 L500,228 L500,212 L540,212 L560,236 L560,268Z"/><circle cx="455" cy="270" r="10"/><circle cx="535" cy="270" r="10"/></g>
      <rect x="470" y="238" width="18" height="6" fill="#b5382f"/><rect x="476" y="232" width="6" height="18" fill="#b5382f"/>
      ${zombie(300,272,.7,"#030403")}${zombie(250,275,.6,"#030403")}${zombie(380,273,.65,"#030403")}${zombie(80,280,.8,"#030403")}`);
  },

  corredor(cao){
    const lights=[0,1,2,3].map(i=>{const y=40+i*22,w=60-i*12; return `<rect x="${320-w/2}" y="${y}" width="${w}" height="4" fill="#e8f0d8" ${i===1?'class="flicker"':""}/>`;}).join("");
    return svg("Corredor escuro do hospital, luzes piscando, vultos no fim",`
      <rect width="640" height="300" fill="#0c100e"/>
      <polygon points="0,0 640,0 400,110 240,110" fill="#151b17"/>
      <polygon points="0,300 640,300 400,190 240,190" fill="#0a0d0b"/>
      <polygon points="0,0 240,110 240,190 0,300" fill="#121814"/>
      <polygon points="640,0 400,110 400,190 640,300" fill="#121814"/>
      <rect x="240" y="110" width="160" height="80" fill="#2a3a30"/>
      ${lights}
      <polygon points="300,190 340,190 420,300 220,300" fill="#e8f0d8" opacity=".05"/>
      ${zombie(300,190,.9,"#050706")}${zombie(335,192,.95,"#050706")}${zombie(365,190,.85,"#050706")}
      <rect x="60" y="80" width="40" height="150" fill="#0a0d0b" transform="skewY(20)"/>
      <rect x="560" y="-120" width="40" height="150" fill="#0a0d0b" transform="skewY(-20)"/>
      <g fill="#070908"><rect x="440" y="215" width="110" height="12"/><rect x="448" y="227" width="4" height="40"/><rect x="540" y="227" width="4" height="40"/></g>
      <path d="M455,215 Q480,195 520,212" stroke="#3a443c" stroke-width="10" fill="none"/>
      <text x="120" y="70" font-family="monospace" font-size="11" fill="#7a2a22" transform="rotate(12 120 70)">NÃO ENTRE</text>
      ${person(160,300,1.4,"#020302")}${cao?dog(215,300,1.2,"#020302"):""}`);
  },

  farmacia(){
    return svg("Farmácia de beira de estrada com a cruz verde piscando",`
      <defs>${grad("fs",["#3a4448","#a4a89a"])}</defs>
      <rect width="640" height="300" fill="url(#fs)"/>
      <path d="M0,230 L640,230 L640,300 L0,300Z" fill="#1c1e1a"/>
      <rect x="150" y="100" width="340" height="132" fill="#262a26"/>
      <rect x="140" y="88" width="360" height="16" fill="#1a1d1a"/>
      <rect x="180" y="135" width="120" height="80" fill="#4c5a54"/><rect x="340" y="135" width="120" height="80" fill="#4c5a54"/>
      <path d="M190,140 L240,190 L220,215 M240,190 L295,170" stroke="#cfd6c4" stroke-width="1" opacity=".6" fill="none"/>
      <g class="flicker"><rect x="309" y="40" width="22" height="56" fill="#3fbf6a"/><rect x="292" y="57" width="56" height="22" fill="#3fbf6a"/></g>
      <rect x="318" y="96" width="4" height="0" fill="#000"/>
      <text x="320" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#9aa69a" letter-spacing="3">DROGARIA KM 12</text>
      <g fill="#111311"><rect x="80" y="245" width="70" height="8"/><path d="M500,262 L500,240 L548,240 L560,226 L594,226 L606,244 L620,246 L620,262Z"/><circle cx="522" cy="264" r="11"/><circle cx="598" cy="264" r="11"/></g>
      ${zombie(420,232,.7,"#0f110f")}`);
  },

  corvos(){
    const r=rng(9); let crowd="";
    for(let i=0;i<6;i++){ const x=170+i*55+r()*12; crowd+=raider(x,250-(i%2)*4,.95+r()*.2,"#0a0504"); }
    const barrel=(x)=>`<rect x="${x-12}" y="228" width="24" height="30" fill="#1a0c08"/><path class="fire" d="M${x-12},228 Q${x-14},200 ${x-4},208 Q${x},180 ${x+4},206 Q${x+14},196 ${x+12},228Z" fill="#f08a2a"/><path class="fire" d="M${x-6},228 Q${x-6},212 ${x},214 Q${x+6},210 ${x+6},228Z" fill="#ffd36a"/>`;
    return svg("Bloqueio na estrada: saqueadores com máscaras de penas ao redor de barris em chamas",`

  fim:       {name:"Fim da Linha",      tone:"var(--blood)", label:"Morte"},
};

let st, fx=[];
const S_cao = () => st && st.cao;
function reset(){
  st = {day:1, hp:100, sup:3, item:null, balas:0, kitUsado:false,
        marcos:false, cao:false, amostra:false, mordida:false, corvos:null, route:null, causa:""};
  fx=[];
}
const note = (t,k="neu") => fx.push([t,k]);
function supply(n){ st.sup=Math.max(0,st.sup+n); note(`${n>0?"+":""}${n} Suprimentos`, n>0?"pos":"neg"); }
// retorna true se Lia morreu
function hurt(n, causa){
  st.hp -= n; note(`−${n} Vida`,"neg");
  if (st.item==="kit" && !st.kitUsado && st.hp < 50){
    st.kitUsado=true; st.hp=Math.min(100,st.hp+35); note("Kit médico usado: +35 Vida","pos");
  }
  if (st.hp<=0){ st.hp=0; st.causa=causa; return true; }
  return false;
}

function loadSeen(){ try{ return JSON.parse(localStorage.getItem("ua2_endings")||"[]"); }catch(e){ return []; } }
function saveSeen(id){ try{ const s=new Set(loadSeen()); s.add(id); localStorage.setItem("ua2_endings",JSON.stringify([...s])); }catch(e){} }

function updateHud(){
  day.textContent=st.day; hp.textContent=st.hp; sup.textContent=st.sup;
  const bar=document.getElementById("hpbar"); bar.style.width=st.hp+"%";
  bar.style.background = st.hp>60?"var(--accent)":st.hp>30?"var(--gold)":"var(--blood)";
  const c=[];
  if(st.item==="kit") c.push(st.kitUsado?"Kit médico (usado)":"Kit médico");
  if(st.item==="pistola") c.push(`Pistola (${st.balas} ${st.balas===1?"bala":"balas"})`);
  if(st.marcos) c.push("Companheiro: Marcos");
  if(st.cao) c.push("Companheiro: Farol 🐕");
  if(st.amostra) c.push("Amostra H-17");
  let h=c.map(t=>`<span class="chip">${t}</span>`).join("");
  if(st.mordida) h+=`<span class="chip bad">Infectada</span>`;
  chips.innerHTML=h;
}

function render({art, chapter, title, paras, choices, ending}){
  updateHud();
  const el=document.getElementById("scene");
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  let html = art?`<div class="art">${art}</div>`:"";
  html += `<div class="chapter">${chapter}</div><h2 class="scene-title">${title}</h2><div id="text">`;
  html += paras.filter(Boolean).map(p=>p.startsWith("—")?`<p class="say">${p}</p>`:`<p>${p}</p>`).join("") + `</div>`;
  if(fx.length){ html += `<div class="fx">${fx.map(([t,k])=>`<span class="${k}">${t}</span>`).join("")}</div>`; fx=[]; }
  if(ending){
    const e=ENDINGS[ending]; saveSeen(ending); const seen=loadSeen();
    html += `<div class="ending" style="border-left:3px solid ${e.tone}"><div class="tag" style="color:${e.tone}">${e.label}</div><h3>${e.name}</h3></div>`;
    html += `<div class="gallery">Finais descobertos: ${seen.length}/${Object.keys(ENDINGS).length}<ul>`+
      Object.entries(ENDINGS).map(([k,v])=>`<li class="${seen.includes(k)?"got":""}">${seen.includes(k)?v.name:"???"}</li>`).join("")+`</ul></div>`;
  }
  html += `<div class="choices">`+choices.map((c,i)=>`<button data-i="${i}" class="${c.danger?"danger":""}">${c.t}${c.s?`<small>${c.s}</small>`:""}</button>`).join("")+`</div>`;
  el.innerHTML=html;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>choices[+b.dataset.i].go());
  window.scrollTo({top:0,behavior:"smooth"});
}
const next = (fn, t="Continuar") => [{t, go:fn}];

        st.balas--; note("−1 Bala","neg");
        paras.push("O disparo ecoa como um trovão. O zumbi cai. Você bate a porta com o ombro e passa o trinco, o ouvido zunindo.");
        dead=hurt(5,"no posto");
      } else if(st.marcos){
        paras.push("Marcos empurra a porta com o corpo todo enquanto você passa o trinco. Unhas arranham seu ombro, mas não rompem a pele.");
        dead=hurt(8,"no posto");
      } else {
        paras.push("Você empurra sozinha. Os dentes passam a centímetros do seu rosto. Quando o trinco finalmente fecha, seu ombro está em carne viva de tanto bater na porta.");

      }
      paras.push("Os vultos ficam arranhando o vidro por uma hora e então perdem o interesse. Farol se enrola no seu colo, tremendo. Ele lambe o corte no seu braço. Pela primeira vez em semanas, você não se sente sozinha.");

      paras=[

  },

  hospital(){
    let paras=["O saguão do Santa Clara está escuro e cheira a formol e podridão. Você desce as escadas até o subsolo, contando os passos de memória."], dead=false;
    if(st.cao){
      paras.push("Farol vai na frente, focinho baixo. A cada esquina ele para e rosna baixinho — e você muda de caminho. Ele te guia pelo labirinto sem que você precise enfrentar um único deles.");
      dead=hurt(5,"no hospital");
    } else if(st.item==="pistola" && st.balas>0){
      paras.push(`No corredor da farmácia, eles te encontram. Você atira até o carregador esvaziar. ${st.balas} ${st.balas===1?"tiro":"tiros"}, ${st.balas===1?"um corpo":"corpos"} no chão — e o eco atraindo mais. Você corre.`);
      note(`−${st.balas} ${st.balas===1?"Bala":"Balas"}`,"neg"); st.balas=0;
      dead=hurt(15,"no hospital");
    } else {
      paras.push("No corredor da farmácia, eles te cercam. Você golpeia com o pé-de-cabra, uma, duas, três vezes. Então sente os dentes se fecharem no seu ombro.");

      dead=hurt(30,"no hospital");

      paras.push("<i>“Amostra H-17. Anticorpos de um paciente imune. Pode ser a cura — mas eu não tenho como levá-la. Base Ferreira, laboratório da Marinha. Código de autenticação no rádio: ÔMEGA-SETE. Quem encontrar isto: por favor.”</i>");
      st.amostra=true; note("Item: Amostra H-17","pos"); note("Antibióticos encontrados","pos"); supply(+2);
    }

    const paras=[]; let dead=false;
    if(acao==="pagar"){
      st.corvos="pagou";
      if(st.sup>0){
        paras.push("Você abre a caçamba. Os Corvos levam tudo: comida, água, até a lanterna. Bento dá dois tapinhas no capô.");
        supply(-st.sup);
      } else {
        paras.push("— Não tem nada? — Bento suspira, quase decepcionado. — Então paga de outro jeito.");
        paras.push("Eles te arrastam para fora do carro. A surra dura menos de um minuto, mas parece uma hora.");
        dead=hurt(30,"no pedágio dos Corvos");
      }
      if(st.cao && !dead) paras.push("Quando um deles avança em Farol, o cachorro mostra os dentes de um jeito que faz até Bento rir e recuar. — Fica com o bicho. Tá magro demais mesmo.");
      paras.push("A barreira se abre. Você passa devagar, sentindo os olhares nas suas costas.");
    } else {
      st.corvos="lutou";
      if(st.item==="pistola" && st.balas>0){
        paras.push("Você saca a pistola e atira no barril de combustível ao lado de Bento. A explosão de fogo espalha os Corvos como, bem, corvos.");
        st.balas--; note("−1 Bala","neg");
        paras.push("Você acelera pelo vão entre os carros. No caminho, pega duas mochilas que eles deixaram cair.");

      } else {
        if(st.item==="pistola") paras.push("Você saca a pistola e puxa o gatilho. <i>Clique.</i> Vazia. Bento gargalha.");

          paras.push("Marcos sai do carro mancando e se joga contra Bento com tudo o que tem. — <b>Vai, Lia! Acelera!</b>");

          st.marcos=false; note("Marcos morreu","neg");
          dead=hurt(20,"no pedágio dos Corvos");
        } else if(st.cao){
          paras.push("Farol salta pela janela e crava os dentes na perna de Bento. No caos, você passa por cima de uma moto e rompe a barreira.");
          paras.push("Um taco acerta o vidro e os estilhaços cortam seu rosto. No retrovisor, uma mancha marrom corre atrás do carro — Farol! Você para, ele pula para dentro, e você nunca acelerou tanto na vida.");
          dead=hurt(30,"no pedágio dos Corvos");
        } else {
          paras.push("Você avança com o pé-de-cabra. Acerta um. Dois. Então são seis contra uma.");

  },

        "Você cai de joelhos no asfalto frio. A mochila escorrega do seu ombro. Você pensa em levantar. Pensa no rádio, na base, na fazenda da sua avó com a porteira azul.",
        st.cao ? "A última coisa que você sente é o focinho de Farol empurrando sua mão, insistindo para você levantar." : "A última coisa que você ouve são os passos arrastados chegando mais perto.",

    render({
      art:ART.corvos(), chapter:"Epílogo", title:"Dia 40 — Asas Negras", ending:"corvos",
      paras:[

        "Por trás da máscara, ninguém vê sua expressão. Nem você sabe mais qual é."
      ],
      choices:next(S.intro,"Jogar novamente")
    });

  final(){
    const base = st.route==="base";
    let key;
    if(st.mordida) key="ultimo";
    else if(base) key = st.amostra?"cura" : st.marcos?"resgate" : st.cao?"instinto" : "portoes";
    else key = st.marcos?"raizes" : st.cao?"companhia" : "silencio";
    if(key==="portoes") st.hp=0;
    st.day = base?7:10;
    const T = TEXTS[key]();
    render({art:ART[key](), chapter:"Epílogo", title:T.title, paras:T.paras, ending:key, choices:next(S.intro,"Jogar novamente")});
  },
};

    "Naquela noite, do alto do morro, você vê uma fila de faróis na estrada: uma caravana de nômades. Farol abana o rabo pela primeira vez em dias e corre até eles.",
    "Você vai atrás. Não é um lar. Mas é gente. E, por enquanto, é suficiente."
  ]}),
  portoes:()=>({title:"Dia 7 — Ninguém Atende", paras:[
    "A Base Ferreira surge no horizonte com as bandeiras tremulando. Você acelera.",
    "Só quando atravessa o portão aberto você percebe: ninguém nas torres. O alto-falante repete uma gravação antiga: <i>“...dirijam-se à zona segura...”</i>",
    "A gravação foi o que os atraiu. Centenas deles, esperando nos hangares. Agora saem todos ao mesmo tempo, atraídos pelo motor.",
    "Você corre até a torre de rádio e tranca a porta. O painel está cheio de códigos militares que você não sabe usar. Alguém saberia. Por um segundo, você pensa no homem do mercado.",
    "Você conta as latas que sobraram e escuta as unhas arranhando o metal lá embaixo.",
    "A porta aguenta onze dias."
  ]}),
  raizes:()=>({title:"Dia 10 — Vila Jabuticaba", paras:[
    "A fazenda está exatamente como você lembrava: a porteira azul, o pé de jabuticaba, o poço.",
    "Com os antibióticos, a perna de Marcos cicatriza. Ele monta uma antena no telhado com peças de um trator velho e começa a transmitir: <i>“Fazenda segura. Água e comida. Venham.”</i>",
    "Os primeiros chegam no mês seguinte: uma professora, dois irmãos adolescentes, um senhor que sabe consertar qualquer motor. Depois outros.",
    "Dois anos depois, trinta pessoas vivem ali. Há uma escola no celeiro, um moinho, uma horta que alimenta todo mundo.",
    st.cao ? "Farol virou o cão de guarda oficial e o melhor amigo de todas as crianças." : "",
    st.amostra ? "A amostra H-17 continua no freezer do porão. Às vezes você fica olhando para ela e se pergunta o que poderia ter sido." : "",
    "Os moradores chamam o lugar de Vila Jabuticaba. Você chama de casa."
  ]}),
  companhia:()=>({title:"Dia 10 — Só Nós Dois", paras:[
    "A fazenda está exatamente como você lembrava: a porteira azul, o pé de jabuticaba, o poço.",
    "Você e Farol aprendem a viver ali. Ele late quando algum errante se aproxima da cerca; você cuida do resto. Ele te acorda de madrugada para ver estrelas cadentes — ou talvez só queira comida.",
    "Os anos passam. O focinho dele fica branco. Ele já não corre atrás das galinhas.",
    "Numa tarde quente, ele deita a cabeça no seu colo na varanda e não levanta mais.",
    "Você o enterra sob a jabuticabeira. Naquela noite, pela primeira vez em anos, você liga o rádio e responde a uma voz pedindo ajuda.",
    "— Aqui é Lia. Tenho uma fazenda. Tem lugar.",
    st.amostra ? "No porão, a amostra H-17 continua esperando alguém que saiba o que fazer com ela." : ""
  ]}),
  silencio:()=>({title:"Dia 10 — E Depois, Nada", paras:[
    "A fazenda está exatamente como você lembrava: a porteira azul, o pé de jabuticaba, o poço.",
    "Você reforça as cercas sozinha. Planta sozinha. Abate os errantes que aparecem na estrada sozinha. É eficiente. É segura.",
    "As semanas viram meses. Os meses viram anos. Você fala com as galinhas. Depois, para de falar.",
    "Às vezes, o rádio velho capta vozes — colônias, comboios, alguém pedindo ajuda. Você nunca responde. Gente é risco.",
    st.amostra ? "No porão, a amostra H-17 descongela num apagão de verão. Você nem percebe." : "",
    "Numa tarde de inverno, você se lembra de um homem num mercado e de um cachorro latindo numa porta de vidro.",
    "Você sobreviveu ao apocalipse. Só não sabe para quê."
  ]}),
  ultimo:()=>{
    const base=st.route==="base";
    const p=[
      "A febre chega no sexto dia, exatamente como você sabia que chegaria. As veias escuras já passaram do pescoço.",
    ];
    if(st.amostra){
      p.push("Naquela noite, com as mãos tremendo, você abre a maleta da Dra. Helena. <i>Anticorpos de um paciente imune.</i> Ninguém nunca testou. Você é enfermeira. Você sabe que é loucura.");
      p.push("Você enche a seringa e injeta a amostra H-17 na própria veia.");
      if(st.marcos||st.cao) p.push(st.marcos ? "— Se eu mudar — você diz a Marcos —, não hesita." : "Farol deita encostado em você e não sai de perto a noite inteira.");
      p.push("Você sobe até o telhado para ver o sol nascer. A febre arde. O mundo gira.");
      p.push("Quando o primeiro raio de luz toca seu rosto, você percebe que ainda está aqui. Ainda está pensando. Ainda é você.");
      p.push("Talvez seja a amostra. Talvez seja só o último amanhecer. Você fecha os olhos e decide acreditar no primeiro.");
    } else {
      if(st.marcos) p.push(base ? "Você ensina a Marcos tudo o que sabe sobre feridas e febres. Ele vai precisar quando o helicóptero chegar. Você não vai embarcar." : "Você ensina a Marcos a cuidar da horta e do poço. A fazenda vai ser dele.");
      if(st.cao) p.push("Você amarra no pescoço de Farol um bilhete: <i>“Este é o Farol. Ele salva vidas. Cuide dele.”</i>");
      p.push("Então, antes que seja tarde, você sobe sozinha até o alto de um prédio, de onde dá para ver toda Vale Cinza.");
      p.push("Você se senta na beirada e espera o sol. Foi uma boa enfermeira. Foi uma boa sobrevivente, pelo tempo que deu.");
      p.push("O céu fica laranja, depois rosa, depois dourado. É o amanhecer mais bonito que você já viu.");
    }
    return {title:"Dia 7 — Último Turno", paras:p};
  },
};

S.intro();
</script>
